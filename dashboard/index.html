<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explainer RL</title>
<style>
:root {
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --border: #e8e7e1;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --good: #0ca30c; --warn: #fab219; --bad: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --border: #2c2c2a; --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  }
}
:root[data-theme="dark"] {
  --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --border: #2c2c2a; --s1: #3987e5; --s2: #d95926; --s3: #199e70;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.status { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.on { background: var(--good); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.chip { border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; font-variant-numeric: tabular-nums; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; min-width: 0; }
.tile .label, .card h2 { font-size: 12px; font-weight: 500; color: var(--ink-2); margin: 0 0 6px; }
.tile .value { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.tile .sub { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.card h2 { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.legend { display: flex; gap: 12px; font-size: 12px; color: var(--ink-2); font-weight: 400; }
.legend i { display: inline-block; width: 10px; height: 2px; vertical-align: middle; margin-right: 5px; border-radius: 1px; }
.chart { position: relative; height: 200px; }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.empty { height: 100%; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); white-space: nowrap; display: none; z-index: 2; }
.tip b { font-weight: 600; }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
ul.misses { list-style: none; margin: 0; padding: 0; }
ul.misses li { padding: 7px 0; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: space-between; }
ul.misses li:first-child { border-top: 0; }
ul.misses .note { color: var(--muted); font-size: 12px; }
ul.misses time { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
pre { margin: 0; white-space: pre-wrap; font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink); }
.muted { color: var(--muted); }
button.tbl { background: none; border: 0; color: var(--muted); font: inherit; font-size: 12px; cursor: pointer; padding: 0; }
button.tbl:hover { color: var(--ink); }
table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
td, th { text-align: left; padding: 4px 6px; border-top: 1px solid var(--border); }
th { color: var(--ink-2); font-weight: 500; }
ul.pops { list-style: none; margin: 0; padding: 0; }
ul.pops > li { border-top: 1px solid var(--border); }
ul.pops > li:first-child { border-top: 0; }
ul.pops summary { display: grid; grid-template-columns: 150px 1fr auto; gap: 12px; align-items: baseline; padding: 8px 0; cursor: pointer; list-style: none; }
ul.pops summary::-webkit-details-marker { display: none; }
ul.pops summary::before { content: '▸'; color: var(--muted); position: absolute; margin-left: -14px; }
ul.pops details[open] summary::before { content: '▾'; }
ul.pops details { padding-left: 14px; }
ul.pops .when { font-variant-numeric: tabular-nums; }
ul.pops .when small, ul.pops .where small { display: block; color: var(--muted); font-size: 12px; }
ul.pops .where { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
ul.pops .res { font-size: 12px; white-space: nowrap; }
.res.good { color: var(--good); } .res.bad { color: var(--bad); } .res.skip { color: var(--muted); }
.pop-body { padding: 4px 0 14px; display: grid; gap: 10px; }
.pop-body h3 { font-size: 12px; font-weight: 500; color: var(--ink-2); margin: 0 0 4px; }
.pop-body pre { max-height: 320px; overflow: auto; background: var(--page); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; }
.pop-body ul { margin: 0; padding-left: 18px; }
.pop-body li.ok::marker { content: '✓  '; color: var(--good); }
.pop-body li.no::marker { content: '✗  '; color: var(--bad); }
@media (max-width: 760px) { ul.pops summary { grid-template-columns: 1fr auto; } ul.pops .where { grid-column: 1 / -1; grid-row: 2; } }
@media (max-width: 760px) { .tiles { grid-template-columns: 1fr 1fr; } .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Explainer RL</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="phase">…</span><span class="chip" id="next" title="A round starts on its own once enough new feedback builds up"></span><span class="chip" id="version">v000</span></div>
  </header>

  <section class="tiles">
    <div class="card tile"><div class="label">Understood · 7 days</div><div class="value" id="t-rate">–</div><div class="sub" id="t-rate-sub">popup points</div></div>
    <div class="card tile"><div class="label">Popups answered</div><div class="value" id="t-pop">–</div><div class="sub" id="t-pop-sub"></div></div>
    <div class="card tile"><div class="label">Past items missed</div><div class="value" id="t-hist">–</div><div class="sub" id="t-hist-sub"></div></div>
    <div class="card tile"><div class="label">Training pairs</div><div class="value" id="t-pairs">–</div><div class="sub" id="t-pairs-sub"></div></div>
  </section>

  <section class="card" style="margin-bottom:12px">
    <h2><span>Popups</span><span class="legend muted" id="pops-n"></span></h2>
    <ul class="pops" id="pops"></ul>
  </section>

  <section class="grid2">
    <div class="card">
      <h2><span>Prompt score by round</span><span class="legend"><span><i style="background:var(--s1)"></i>Live</span><span><i style="background:var(--s2)"></i>Small model</span><span><i style="background:var(--s3)"></i>Claude</span><button class="tbl" data-t="rounds">Table</button></span></h2>
      <div class="chart" id="c-rounds"></div>
    </div>
    <div class="card">
      <h2><span>Understood by day</span><span class="legend"><button class="tbl" data-t="daily">Table</button></span></h2>
      <div class="chart" id="c-daily"></div>
    </div>
  </section>

  <section class="grid2">
    <div class="card">
      <h2><span>Why it didn't land</span><span class="legend muted" id="causes-n"></span></h2>
      <div class="chart" id="c-causes"></div>
    </div>
    <div class="card">
      <h2><span>Recent misses</span><span class="legend muted" id="miss-src"></span></h2>
      <ul class="misses" id="misses"></ul>
    </div>
  </section>

  <section class="card">
    <h2><span>Live prompt</span><span class="legend muted" id="prompt-meta"></span></h2>
    <pre id="prompt"></pre>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const pct = v => v == null ? '–' : Math.round(v * 100) + '%';
const ago = t => { const s = Date.now() / 1000 - t; return s < 3600 ? Math.max(1, Math.round(s / 60)) + 'm' : s < 86400 ? Math.round(s / 3600) + 'h' : Math.round(s / 86400) + 'd'; };
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent && parent.appendChild(n); return n; };
const tables = { rounds: false, daily: false };
let data = null;

function empty(box, text) { box.innerHTML = `<div class="empty">${text}</div>`; }

function table(box, head, rows) {
  box.innerHTML = '<div style="overflow:auto;height:100%"><table><tr>' + head.map(h => `<th>${h}</th>`).join('') + '</tr>' +
    rows.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>').join('') + '</table></div>';
}

// series: [{name, color, values: [number|null]}], xs: labels
function lineChart(box, xs, series, { min, max, fmt }) {
  box.innerHTML = '';
  const W = box.clientWidth, H = box.clientHeight, L = 34, R = 86, T = 8, B = 22;
  const svg = el('svg', { viewBox: `0 0 ${W} ${H}` }, box);
  const x = i => xs.length === 1 ? L + (W - L - R) / 2 : L + i * (W - L - R) / (xs.length - 1);
  const y = v => T + (1 - (v - min) / (max - min)) * (H - T - B);
  for (let k = 0; k <= 2; k++) {
    const v = min + (max - min) * k / 2;
    el('line', { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: css('--grid'), 'stroke-width': 1 }, svg);
    el('text', { x: L - 8, y: y(v) + 4, 'text-anchor': 'end', 'font-size': 11, fill: css('--muted') }, svg).textContent = fmt(v);
  }
  const step = Math.ceil(xs.length / 8);
  xs.forEach((lab, i) => { if (i % step === 0 || i === xs.length - 1) el('text', { x: x(i), y: H - 4, 'text-anchor': 'middle', 'font-size': 11, fill: css('--muted') }, svg).textContent = lab; });
  const cross = el('line', { y1: T, y2: H - B, stroke: css('--muted'), 'stroke-width': 1, 'stroke-dasharray': '2 3', opacity: 0 }, svg);
  for (const s of series) {
    const pts = s.values.map((v, i) => v == null ? null : [x(i), y(v)]);
    const d = pts.reduce((acc, p) => p ? acc + (acc && !acc.endsWith('|') ? 'L' : 'M') + p[0] + ',' + p[1] : acc + '|', '').replace(/\|/g, '');
    el('path', { d, fill: 'none', stroke: s.color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, svg);
    pts.forEach(p => p && el('circle', { cx: p[0], cy: p[1], r: 4, fill: s.color, stroke: css('--surface'), 'stroke-width': 2 }, svg));
    const lastI = s.values.map((v, i) => v == null ? -1 : i).filter(i => i >= 0).pop();
    if (lastI != null) el('text', { x: x(lastI) + 9, y: y(s.values[lastI]) + 4, 'font-size': 11, fill: css('--ink-2') }, svg).textContent = s.name;
  }
  const tip = document.createElement('div'); tip.className = 'tip'; box.appendChild(tip);
  const hit = el('rect', { x: L, y: T, width: W - L - R, height: H - T - B, fill: 'transparent' }, svg);
  hit.addEventListener('mousemove', ev => {
    const r = svg.getBoundingClientRect(), mx = (ev.clientX - r.left) * W / r.width;
    let i = 0, best = 1e9; xs.forEach((_, j) => { const dd = Math.abs(x(j) - mx); if (dd < best) { best = dd; i = j; } });
    cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.setAttribute('opacity', 1);
    tip.innerHTML = `<b>${xs[i]}</b>` + series.filter(s => s.values[i] != null).map(s => `<div><i style="background:${s.color}"></i>${s.name} ${fmt(s.values[i])}</div>`).join('');
    tip.style.display = 'block';
    const left = x(i) / W * box.clientWidth; tip.style.left = Math.min(left + 12, box.clientWidth - tip.offsetWidth) + 'px'; tip.style.top = '4px';
  });
  hit.addEventListener('mouseleave', () => { tip.style.display = 'none'; cross.setAttribute('opacity', 0); });
}

function barChart(box, items) {
  box.innerHTML = '';
  const W = box.clientWidth, rowH = 22, L = 120, R = 34;
  const H = Math.max(box.clientHeight, items.length * rowH);
  const svg = el('svg', { viewBox: `0 0 ${W} ${H}` }, box);
  const max = Math.max(...items.map(i => i.n));
  const tip = document.createElement('div'); tip.className = 'tip'; box.appendChild(tip);
  items.forEach((it, k) => {
    const yy = k * rowH + 4, w = Math.max(4, (W - L - R) * it.n / max);
    el('text', { x: L - 10, y: yy + 11, 'text-anchor': 'end', 'font-size': 12, fill: css('--ink-2') }, svg).textContent = it.name;
    el('rect', { x: L, y: yy + 2, width: w, height: 12, rx: 4, fill: css('--s1') }, svg);
    el('text', { x: L + w + 6, y: yy + 12, 'font-size': 11, fill: css('--muted') }, svg).textContent = it.n;
    const hit = el('rect', { x: 0, y: yy - 2, width: W, height: rowH, fill: 'transparent' }, svg);
    hit.addEventListener('mousemove', () => { tip.innerHTML = `<b>${it.name}</b><div>${it.n} items</div>`; tip.style.display = 'block'; tip.style.left = (L + w + 30) / W * box.clientWidth + 'px'; tip.style.top = yy + 'px'; });
    hit.addEventListener('mouseleave', () => tip.style.display = 'none');
  });
}

const openPops = new Set();
const when = t => new Date(t * 1000).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
function popResult(e) {
  if (e.excluded) return ['skip', 'Not used'];
  if (e.skipped) return ['skip', 'Skipped'];
  const f = e.feedback; if (!f) return ['skip', 'No answer'];
  const got = f.none ? 0 : f.understood.length, n = e.points.length;
  return [got === n ? 'good' : got === 0 ? 'bad' : '', `${got}/${n} understood`];
}
function renderPops(list) {
  $('pops-n').textContent = list.length ? `${list.length} total` : '';
  if (!list.length) { $('pops').innerHTML = '<li class="muted" style="padding:8px 0">No popups yet.</li>'; return; }
  $('pops').innerHTML = list.map(e => {
    const [cls, res] = popResult(e), f = e.feedback || {};
    const project = e.cwd.split('/').filter(Boolean).pop() || e.cwd;
    const pts = e.points.map(p => `<li class="${f.understood && f.understood.includes(p) && !f.none ? 'ok' : e.skipped ? '' : 'no'}">${esc(p)}</li>`).join('');
    return `<li><details data-id="${esc(e.id)}"${openPops.has(e.id) ? ' open' : ''}>
      <summary><span class="when">${when(e.at)}<small>${ago(e.at)} ago${e.trigger === 'manual' ? ' · manual' : ''}</small></span>
        <span class="where">${esc(project)}<small>${esc(e.app)} · ${esc(e.cwd)}</small></span>
        <span class="res ${cls}">${res}</span></summary>
      <div class="pop-body">
        ${e.prompt ? `<div><h3>What you asked</h3><pre>${esc(e.prompt)}</pre></div>` : ''}
        <div><h3>Claude's message</h3><pre>${esc(e.answer)}</pre></div>
        <div><h3>Popup options</h3><ul>${pts}</ul>${f.other ? `<p><b>You typed:</b> ${esc(f.other)}</p>` : ''}${e.excluded ? `<p class="muted">Not used for training: ${esc(e.excluded)}</p>` : ''}</div>
      </div></details></li>`;
  }).join('');
  $('pops').querySelectorAll('details').forEach(d => d.addEventListener('toggle', () => { d.open ? openPops.add(d.dataset.id) : openPops.delete(d.dataset.id); }));
}

function render() {
  if (!data) return;
  const { status, popups: p, labels: l, rounds, prompt, pairs, adapter } = data;
  const busy = status.phase && status.phase !== 'idle';
  $('dot').className = 'dot' + (busy ? ' on' : '');
  $('phase').textContent = busy ? `${status.phase} · ${status.detail}` : (status.detail || 'idle');
  $('version').textContent = prompt.name;
  $('next').textContent = busy ? 'round running' : `next round: ${Math.min(data.auto.new, data.auto.need)}/${data.auto.need} new feedback`;

  $('t-rate').textContent = pct(p.week_rate);
  $('t-pop').textContent = p.answered;
  $('t-pop-sub').textContent = `${p.asked} asked · ${p.skipped} skipped · ${p.logged} logged`;
  $('t-hist').textContent = l.labelled ? l.missed : '–';
  $('t-hist-sub').textContent = `${l.understood} understood · ${l.unreferenced} not referenced`;
  $('t-pairs').textContent = pairs;
  $('t-pairs-sub').textContent = adapter ? `model ${adapter.name} · ${ago(adapter.at)} ago` : 'model untrained';

  const rb = $('c-rounds');
  if (!rounds.length) empty(rb, 'No rounds yet');
  else if (tables.rounds) table(rb, ['Round', 'Live', 'Small', 'Claude', 'Live after', 'Pairs'], rounds.map(r => [r.round, r.live, r.small ?? '–', r.claude ?? '–', r.deployed ? `${r.deployed} (${r.source})` : '–', r.pairs]));
  else lineChart(rb, rounds.map(r => 'R' + r.round), [
    { name: 'Live', color: css('--s1'), values: rounds.map(r => r.live) },
    { name: 'Small', color: css('--s2'), values: rounds.map(r => r.small) },
    { name: 'Claude', color: css('--s3'), values: rounds.map(r => r.claude) },
  ], { min: 0, max: 10, fmt: v => (+v).toFixed(1) });

  const db = $('c-daily');
  if (!p.daily.length) empty(db, 'No popup answers yet');
  else if (tables.daily) table(db, ['Day', 'Understood'], p.daily.map(d => [d.day, pct(d.rate)]));
  else lineChart(db, p.daily.map(d => d.day.slice(5)), [{ name: 'Understood', color: css('--s1'), values: p.daily.map(d => d.rate) }], { min: 0, max: 1, fmt: pct });

  const cb = $('c-causes');
  $('causes-n').textContent = l.missed ? `${l.missed} items` : '';
  if (!l.causes.length) empty(cb, l.labelled ? 'No causes yet' : 'Labelling…'); else barChart(cb, l.causes);

  const ms = p.misses.length ? p.misses : l.misses;
  $('misses').innerHTML = ms.length
    ? ms.map(m => `<li><div>${esc(m.text)}${m.note ? `<div class="note">${esc(m.note)}</div>` : ''}</div><time>${ago(m.at)}</time></li>`).join('')
    : '<li class="muted">None yet. Popups fill this.</li>';

  renderPops(p.list);
  $('miss-src').textContent = p.misses.length ? 'popups' : 'from history';
  $('prompt').textContent = prompt.text || 'None yet. Claude Code is using its default style.';
  $('prompt-meta').textContent = prompt.at ? `deployed ${ago(prompt.at)} ago` : '';
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

document.querySelectorAll('button.tbl').forEach(b => b.addEventListener('click', () => {
  tables[b.dataset.t] = !tables[b.dataset.t]; b.textContent = tables[b.dataset.t] ? 'Chart' : 'Table'; render();
}));
async function load() { try { data = await (await fetch('/api', { cache: 'no-store' })).json(); render(); } catch (e) { $('phase').textContent = 'server offline'; } }
load(); setInterval(load, 5000);
addEventListener('resize', render);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
</script>
</body>
</html>
